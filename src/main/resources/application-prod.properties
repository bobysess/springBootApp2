# Production Profile Configuration
# Activate with: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod

# Ensure H2 console is disabled in production
spring.h2.console.enabled=false

# SQL logging explicitly disabled for production
spring.jpa.show-sql=false

# Logging configuration for production
logging.level.root=WARN
logging.level.com.bobysess.springBootApp2=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Disable devtools in production (already handled by Maven plugin)
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
