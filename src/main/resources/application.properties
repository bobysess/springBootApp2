spring.application.name=springBootApp2

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console - Disabled by default for security and performance
# Enable in development profile if needed
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# SQL logging disabled for performance - use logging framework instead
spring.jpa.show-sql=false
# Disable open-in-view to prevent lazy loading issues and unnecessary DB connections
spring.jpa.open-in-view=false

# HikariCP Connection Pool Configuration for optimal performance
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000